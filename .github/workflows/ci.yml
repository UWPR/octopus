name: CI

# Runs the type check and the unit tests on every pull request and on every push to main.
# The Playwright end-to-end tests are not run here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx react-scripts test --watchAll=false --forceExit --testPathIgnorePatterns=e2e
