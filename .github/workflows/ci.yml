name: CI

# Runs the type check, the lint, the unit tests and the Playwright end-to-end tests on every pull
# request and on every push to main. The end-to-end tests are a separate job, so each shows as its own
# check.
on:
  # Merges and direct pushes to main.
  push:
    branches: [main]
  # A pull request is checked when it is opened or reopened and on every push to
  # its branch, so a push trigger on other branches would only run the job twice.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # playwright.config.ts runs the tests in Google Chrome (channel 'chrome'). This installs
      # Chrome and the Linux libraries it needs.
      - name: Install Google Chrome
        run: npx playwright install --with-deps chrome

      # Playwright starts the dev server on port 3000 itself.
      - name: End-to-end tests
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
