name: Release artifact

# When a release is published in the GitHub UI, this
# - checks that the released commit is on main
# - runs the type check and the unit tests
# - builds a self-contained single-file offline copy (octopus-<version>.html)
#   and attaches it to the release
# - builds the app from the released commit and deploys it to GitHub Pages,
#   except for a pre-release
on:
  release:
    types: [published]

# Runs one release at a time, so two releases published close together do not
# race their GitHub Pages deploys.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stops the release before anything is built or deployed when the released
      # commit is not on main.
      - name: Check that the released commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Released commit $GITHUB_SHA is not on main. Publish the release from a commit on main."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same checks as ci.yml.
      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      # The single-file app is built and attached before the hosted site, so a
      # failure here stops the release before the deploy. Both builds write to
      # build/, so the single-file app is moved out before the hosted build.
      # CI=false so pre-existing lint warnings do not fail either build, matching
      # the behavior of a local build.
      - name: Build the single-file offline app
        run: |
          npm run build:singlefile
          mkdir release-asset
          mv build/octopus-*.html release-asset/
        env:
          CI: false

      - name: Attach the single-file app to the release
        uses: softprops/action-gh-release@v2
        with:
          files: release-asset/octopus-*.html

      - name: Build the hosted site
        run: npm run build
        env:
          CI: false

      - name: Deploy to GitHub Pages
        if: ${{ !github.event.release.prerelease }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
