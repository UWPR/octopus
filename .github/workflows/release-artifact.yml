name: Release artifact

# When a release is published in the GitHub UI, this
# - checks that the released commit is on main
# - runs the type check and the unit tests
# - builds the app from the released commit and deploys it to GitHub Pages,
#   except for a pre-release
# - attaches a self-contained single-file offline copy (octopus-<version>.html)
#   to the release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stops the release before anything is built or deployed when the released
      # commit is not on main.
      - name: Check that the released commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Released commit $GITHUB_SHA is not on main. Publish the release from a commit on main."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same checks as ci.yml.
      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx react-scripts test --watchAll=false --forceExit --testPathIgnorePatterns=e2e

      # CI=false so pre-existing lint warnings do not fail the build, matching the
      # behavior of a local `npm run build`.
      - name: Build the hosted site
        run: npm run build
        env:
          CI: false

      - name: Deploy to GitHub Pages
        if: ${{ !github.event.release.prerelease }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

      - name: Build the single-file offline app
        run: npm run build:singlefile
        env:
          CI: false

      - name: Attach the single-file app to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/octopus-*.html
